function updateStats() {
  const open = vessels.filter(v => v.status === 'OPEN').length;
  const subs = vessels.filter(v => v.status === 'ON SUBS').length;
  const fixed = vessels.filter(v => v.status === 'FIXED').length;
  const failed = vessels.filter(v => v.status === 'FAILED').length;
  const withdrawn = vessels.filter(v => v.status === 'WITHDRAWN').length;
  document.getElementById('statOpen').textContent = open;
  document.getElementById('statSubs').textContent = subs;
  document.getElementById('statFixed').textContent = fixed;
  document.getElementById('statTotal').textContent = vessels.length;
  // Filter pill counts
  const ce = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = `(${val})`; };
  ce('cntAll', vessels.length); ce('cntOpen', open); ce('cntSubs', subs);
  ce('cntFixed', fixed); ce('cntFailed', failed); ce('cntWithdrawn', withdrawn);
}

function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const etaFrom = document.getElementById('etaFrom').value;
  const etaTo = document.getElementById('etaTo').value;
  const tbody = document.getElementById('vesselBody');
  const empty = document.getElementById('emptyState');

  let filtered = vessels.filter(v => {
    if (!activeFilters.has('ALL') && !activeFilters.has(v.status)) return false;
    if (etaFrom && (!v.eta_ecsa || v.eta_ecsa < etaFrom)) return false;
    if (etaTo && (!v.eta_ecsa || v.eta_ecsa > etaTo)) return false;
    if (search) {
      const hay = `${v.vessel_name||''} ${v.owner||''} ${v.source||''} ${v.current_position||''} ${v.delivery_basis||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  filtered.sort((a, b) => {
    const va = getSortValue(a, currentSort.key);
    const vb = getSortValue(b, currentSort.key);
    let cmp = typeof va === 'string' ? va.localeCompare(vb) : va - vb;
    if (currentSort.dir === 'desc') cmp = -cmp;
    if (cmp === 0 && (currentSort.key === 'eta_ecsa' || currentSort.key === 'laycan')) {
      return (getP6Values(b).offer || 0) - (getP6Values(a).offer || 0);
    }
    return cmp;
  });

  empty.style.display = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('vesselTable').style.display = filtered.length === 0 ? 'none' : '';

  // Build headers dynamically from columnOrder
  const sortKeys = {laycan:'laycan',vessel:'vessel_name',owner:'owner',specs:'dwt',scr:null,delivery:'delivery_basis',eta:'eta_ecsa',p6_bid:'p6_bid',p6_offer:'p6_offer',spread:'spread',fixed:'fixed_price',charterer:'charterer',date_fixed:'date_fixed',last_updated:'last_updated',notes:null,status:'status',actions:null};
  const thClasses = {p6_bid:'col-p6',p6_offer:'col-p6',fixed:'col-fixed'};
  const visCols = columnOrder.filter(c => !hiddenColumns.has(c));
  const headRow = document.querySelector('#vesselHead tr');
  headRow.innerHTML = visCols.map(c => {
    const sk = sortKeys[c];
    const cls = thClasses[c] ? ` class="${thClasses[c]}"` : '';
    const onclick = sk ? ` onclick="sortBy('${sk}')"` : '';
    return `<th${cls}${onclick} draggable="true" data-col="${c}">${COL_LABELS[c]||c}</th>`;
  }).join('');

  let lastLaycan = null;
  const rows = [];

  // Laycan color map — rotating distinct colors per period
  const laycanColors = {
    'FH Jan':'0','LH Jan':'0','FH Feb':'1','LH Feb':'1','FH Mar':'2','LH Mar':'2',
    'FH Apr':'3','LH Apr':'3','FH May':'4','LH May':'4','FH Jun':'5','LH Jun':'5',
    'FH Jul':'0','LH Jul':'0','FH Aug':'1','LH Aug':'1','FH Sep':'2','LH Sep':'2',
    'FH Oct':'3','LH Oct':'3','FH Nov':'4','LH Nov':'4','FH Dec':'5','LH Dec':'5',
  };

  // Cell renderer map — each column key maps to a function returning HTML
  function cellHTML(col, v, gi) {
    const p6 = getP6Values(v);
    const spread = getSpread(v);
    const laycan = getLaycanPeriod(v.eta_ecsa);
    const lcIdx = laycan ? (laycanColors[laycan] || '0') : null;
    const warnDot = v.parse_warnings && v.parse_warnings.length > 0
      ? `<span class="warn-dot" title="${v.parse_warnings.join('; ')}"></span>` : '';
    const notesText = v.notes || '';
    const notesTrunc = notesText.length > 40 ? notesText.substring(0, 40) + '...' : notesText;
    const statusCls = (v.status || 'OPEN').replace(/\s+/g, '_');

    switch (col) {
      case 'laycan': return laycan ? `<span class="td-laycan laycan-color-${lcIdx}">${laycan}</span>` : '<span style="color:var(--text-dim)">—</span>';
      case 'vessel': return `<td class="td-vessel editable" onclick="startEdit(this,${gi},'vessel_name',true)">${v.vessel_name || '—'}${warnDot}</td>`;
      case 'owner': return `<td class="td-owner editable" onclick="startEdit(this,${gi},'owner',false)">${v.owner || '—'}</td>`;
      case 'specs': return `<td class="td-specs editable" onclick="startEditSpecs(this,${gi})">${v.dwt ? (v.dwt/1000).toFixed(0)+'K' : '—'} / ${v.build_year || '—'}</td>`;
      case 'scr': return `<td class="editable" onclick="startEdit(this,${gi},'scrubber',false)">${v.scrubber === true ? '<span class="scrubber-yes">SCR</span>' : '<span class="scrubber-unk">—</span>'}</td>`;
      case 'delivery': return `<td class="td-port editable" onclick="startEdit(this,${gi},'delivery_basis',false)">${v.delivery_basis || v.current_position || '—'}</td>`;
      case 'eta': {
        const etaText = v.eta_ecsa ? `${fmtDate(v.eta_ecsa)}${v.eta_ecsa_end ? '–' + fmtDate(v.eta_ecsa_end).split(' ')[0] : ''}${v.eta_type === 'ONW' ? ' <span class="onw-badge">ONW</span>' : ''}` : '—';
        return `<td class="td-eta editable" onclick="startEdit(this,${gi},'eta_ecsa',true)">${etaText}</td>`;
      }
      case 'p6_bid': return `<td class="td-p6 editable" onclick="startEdit(this,${gi},'p6_bid',true)"><span class="bid">${p6.bid ? fmtNum(p6.bid) : '—'}</span></td>`;
      case 'p6_offer': return `<td class="td-p6 editable" onclick="startEdit(this,${gi},'p6_offer',true)"><span class="offer">${p6.offer ? fmtNum(p6.offer) : '—'}</span></td>`;
      case 'spread': {
        if (spread == null) return `<td>—</td>`;
        const cls = spread > 0 ? 'spread-pos' : spread < 0 ? 'spread-neg' : 'spread-zero';
        return `<td><span class="td-spread ${cls}">${spread > 0 ? '+' : ''}${fmtNum(spread)}</span></td>`;
      }
      case 'fixed': return `<td class="td-fixed editable" onclick="startEdit(this,${gi},'fixed_price',true)">${v.fixed_price ? fmtNum(v.fixed_price) : '—'}</td>`;
      case 'charterer': return `<td class="td-owner editable" onclick="startEdit(this,${gi},'charterer',false)">${v.charterer || '—'}</td>`;
      case 'date_fixed': return `<td class="td-date editable" onclick="startEdit(this,${gi},'date_fixed',true)">${v.date_fixed ? fmtDate(v.date_fixed) : '—'}</td>`;
      case 'last_updated': return `<td class="td-source">${fmtTimestamp(v.last_updated)}</td>`;
      case 'notes': return `<td class="td-source editable" onclick="startEdit(this,${gi},'notes',false)" title="${notesText.replace(/"/g,'&quot;')}">${notesTrunc || '—'}</td>`;
      case 'status': return `<td><span class="status-badge status-${statusCls}" onclick="cycleStatus(${gi})">${v.status || 'OPEN'}</span></td>`;
      case 'actions': return `<td><button class="btn-remove" onclick="removeVessel(${gi})">x</button></td>`;
      default: return '<td>—</td>';
    }
  }

  for (const v of filtered) {
    const gi = vessels.indexOf(v);
    const laycan = getLaycanPeriod(v.eta_ecsa);

    if ((currentSort.key === 'eta_ecsa' || currentSort.key === 'laycan') && laycan !== lastLaycan) {
      const colorIdx = laycan ? (laycanColors[laycan] || '0') : '0';
      rows.push(`<tr class="group-header group-color-${colorIdx}"><td colspan="99">${laycan || 'NO ETA'}</td></tr>`);
      lastLaycan = laycan;
    }

    const laycanClass = laycan ? 'laycan-' + laycan.toLowerCase().replace(/\s+/g, '-') : '';

    // Build cells in column order
    const cells = visCols.map(col => {
      const html = cellHTML(col, v, gi);
      // cellHTML returns full <td> for most, but laycan returns just inner HTML
      if (col === 'laycan') return `<td>${html}</td>`;
      return html;
    }).join('');

    rows.push(`<tr class="${laycanClass}">${cells}</tr>`);
  }

  tbody.innerHTML = rows.join('');

  // Attach drag-and-drop to header cells
  initHeaderDrag();
  updateStats();
}

// ─── Column Drag-and-Drop Reorder ────────────────────────────────────────────

function initHeaderDrag() {
  let dragCol = null;
  document.querySelectorAll('#vesselHead th[draggable]').forEach(th => {
    th.addEventListener('dragstart', e => {
      dragCol = th.dataset.col;
      th.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    th.addEventListener('dragend', () => {
      th.classList.remove('dragging');
      document.querySelectorAll('#vesselHead th').forEach(t => t.classList.remove('drag-over'));
      dragCol = null;
    });
    th.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      th.classList.add('drag-over');
    });
    th.addEventListener('dragleave', () => th.classList.remove('drag-over'));
    th.addEventListener('drop', e => {
      e.preventDefault();
      th.classList.remove('drag-over');
      const targetCol = th.dataset.col;
      if (!dragCol || dragCol === targetCol) return;
      // Reorder columnOrder
      const fromIdx = columnOrder.indexOf(dragCol);
      const toIdx = columnOrder.indexOf(targetCol);
      if (fromIdx === -1 || toIdx === -1) return;
      columnOrder.splice(fromIdx, 1);
      columnOrder.splice(toIdx, 0, dragCol);
      saveColumns();
      renderTable();
    });
  });
}

// ─── Draggable Divider ───────────────────────────────────────────────────────

(function initDivider() {
  const divider = document.getElementById('divider');
  const layout = document.querySelector('.layout');
  if (!divider || !layout) return;

  let dragging = false;

  divider.addEventListener('mousedown', (e) => {
    dragging = true;
    divider.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const rect = layout.getBoundingClientRect();
    let w = e.clientX - rect.left;
    w = Math.max(240, Math.min(w, rect.width - 300));
    layout.style.setProperty('--inbox-width', w + 'px');
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
})();

// ─── Init ────────────────────────────────────────────────────────────────────
async function init() {
  try {
    // Using embedded data
    if (resp.ok) {
      vessels = await resp.json();
      localStorage.setItem('pt_vessels', JSON.stringify(vessels)); // refresh cache
    } else {
      // API not available (e.g. standalone mode) — fall back to localStorage
      vessels = JSON.parse(localStorage.getItem('pt_vessels') || '[]');
    }
  } catch (e) {
    // Offline or standalone — fall back to localStorage
    vessels = JSON.parse(localStorage.getItem('pt_vessels') || '[]');
  }
  renderTable();
  updateStats();
  renderColumnMenu();
}
init();
</script>
<script>
// ─── Cargo Book Dashboard ────────────────────────────────────────────────────

// Tab switching
function switchTab(tab) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
  if (tab === 'cargo' && cargoData.length > 0) renderCargo();
}

// ─── Cargo State ─────────────────────────────────────────────────────────────

let cargoData = JSON.parse(localStorage.getItem('pt_cargo') || '[]');
let activeCargoStem = 'ALL';
let cargoChart = null;

function saveCargo() { localStorage.setItem('pt_cargo', JSON.stringify(cargoData)); }

// ─── Slot Colors ─────────────────────────────────────────────────────────────

const SLOT_COLORS = {
  'Mar FH': '#533AB7', 'Mar LH': '#AFA9EC',
  'Apr FH': '#185FA5', 'Apr LH': '#85B7EB',
  'May FH': '#0F6E56', 'May LH': '#5DCAA5',
  'Jun FH': '#854F0B', 'Jun LH': '#EF9F27',
  'Jul FH': '#993C1D', 'Jul LH': '#F0997B',
  'Aug FH': '#533AB7', 'Aug LH': '#AFA9EC',
  'Sep FH': '#185FA5', 'Sep LH': '#85B7EB',
  'Oct FH': '#0F6E56', 'Oct LH': '#5DCAA5',
};
function slotColor(k) { return SLOT_COLORS[k] || '#888780'; }

// ─── Known Stems ─────────────────────────────────────────────────────────────

const STEM_MAP = {
  'cont/baltic ta': 'Cont/Baltic TA', 'cont/baltic fronthaul': 'Cont/Baltic Fronthaul',
  'ec can ta': 'EC CAN TA', 'ec can fronthaul': 'EC CAN Fronthaul',
  'usec ta': 'USEC TA', 'usec fhaul': 'USEC Fronthaul', 'usec fronthaul': 'USEC Fronthaul',
  'usg ta': 'USG TA', 'usg fronthaul': 'USG Fronthaul',
  'ncsa ta': 'NCSA TA', 'ncsa fronthaul': 'NCSA Fronthaul',
  'ecsa ta': 'ECSA TA', 'ecsa fronthaul': 'ECSA Fronthaul',
  'wafr ta': 'WAFR TA', 'wafr fronthaul': 'WAFR Fronthaul',
  'bsea/wmed/emed ta': 'Bsea/Med TA', 'bsea/wmed/emed fronthaul': 'Bsea/Med Fronthaul',
  'bsea/med ta': 'Bsea/Med TA', 'bsea/med fronthaul': 'Bsea/Med Fronthaul',
};

const STEM_ORDER = ['ECSA Fronthaul','ECSA TA','NCSA Fronthaul','NCSA TA','USG Fronthaul','USG TA','USEC Fronthaul','USEC TA','EC CAN TA','EC CAN Fronthaul','Cont/Baltic TA','Cont/Baltic Fronthaul','WAFR Fronthaul','WAFR TA','Bsea/Med Fronthaul','Bsea/Med TA'];

// ─── Laycan Parsing ──────────────────────────────────────────────────────────

const MONTH_NAMES = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const MONTH_FULL = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parseLaycanSlot(laycan) {
  if (!laycan) return null;
  const lc = laycan.toLowerCase().replace(/\s+/g, '');
  // Extract leading number
  const dayMatch = lc.match(/^(\d{1,2})/);
  if (!dayMatch) return null;
  const day = parseInt(dayMatch[1], 10);
  // Find month
  const monthMatch = lc.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/);
  if (!monthMatch) return null;
  const monthIdx = MONTH_NAMES.indexOf(monthMatch[1]) + 1;
  const half = day <= 15 ? 'FH' : 'LH';
  return `${MONTH_FULL[monthIdx]} ${half}`;
}

function slotSortKey(slot) {
  if (!slot) return 999;
  const parts = slot.split(' ');
  const month = MONTH_FULL.indexOf(parts[0]);
  return month * 2 + (parts[1] === 'LH' ? 1 : 0);
}

// ─── Cargo Parser ────────────────────────────────────────────────────────────

function parseCargoData(text) {
  const lines = text.split('\n');
  const cargoes = [];
  let currentStem = null;

  for (const line of lines) {
    const cells = line.split('\t').map(c => c.trim());
    if (cells.length < 2 || cells.every(c => !c)) continue;

    // Check if this is a stem header row
    const firstCell = cells[0].toLowerCase().replace(/\s+/g, ' ').trim();
    if (STEM_MAP[firstCell]) {
      currentStem = STEM_MAP[firstCell];
      continue;
    }

    // Skip if no stem context yet
    if (!currentStem) continue;

    // Try to parse as cargo row — need at least a charterer and something else
    const charterer = cells[0].replace(/- NOT FOR LIST/gi, '').trim();
    if (!charterer || charterer.length < 2) continue;

    // Try to find laycan (look for date-like patterns in cells)
    let laycan = null, size = null, cargo = null, load = null, disch = null, updated = null;
    let fresh = false, fixed = false;

    for (let i = 1; i < cells.length; i++) {
      const c = cells[i].toLowerCase();
      if (!cells[i]) continue;
      // Laycan: contains month name + number
      if (!laycan && /\d/.test(c) && /(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/.test(c)) {
        laycan = cells[i];
        continue;
      }
      // Size: contains pmx, kmx, or a number > 10000
      if (!size && (/pmx|kmx|smx/i.test(c) || /^\d{5,}/.test(c))) {
        size = cells[i];
        continue;
      }
      // Cargo type
      if (!cargo && /grain|coal|ore|ferts?|sugar|cement|clinker|petcoke|bauxite|soda ash|sulphur/i.test(c)) {
        cargo = cells[i];
        continue;
      }
      // Updated date
      if (!updated && /^\d{1,2}(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/i.test(c.replace(/\s/g, ''))) {
        updated = cells[i];
        continue;
      }
      // Fresh/Fixed
      if (/^true$/i.test(c) || /^yes$/i.test(c)) {
        // Check column position relative to expected layout
        if (!fresh && i >= cells.length - 4) { fresh = true; continue; }
        if (fresh && !fixed) { fixed = true; continue; }
      }
      // Load/disch
      if (!load && cells[i].length > 1 && cells[i].length < 30) {
        load = cells[i]; continue;
      }
      if (load && !disch && cells[i].length > 1 && cells[i].length < 30) {
        disch = cells[i]; continue;
      }
    }

    // Also check explicit FRESH/FIXED columns
    for (let i = 0; i < cells.length; i++) {
      if (/^FRESH$/i.test(cells[i - 1] || '') || (cells[i] && /^TRUE$/i.test(cells[i]) && i >= cells.length - 3)) {
        // Heuristic: TRUE near the end = fresh, second TRUE = fixed
      }
    }

    if (laycan || cargo || size) {
      const slot = parseLaycanSlot(laycan);
      cargoes.push({
        charterer, size: size || '', load: load || '', disch: disch || '',
        cargo: cargo || '', laycan: laycan || '', slot,
        updated: updated || '', fresh, fixed, stem: currentStem
      });
    }
  }

  return cargoes;
}

// ─── Render ──────────────────────────────────────────────────────────────────

function renderCargo() {
  const statusFilter = document.getElementById('cargoStatusFilter').value;
  const typeFilter = document.getElementById('cargoTypeFilter').value;

  let filtered = cargoData.filter(c => {
    if (activeCargoStem !== 'ALL' && c.stem !== activeCargoStem) return false;
    if (statusFilter === 'fresh' && !c.fresh) return false;
    if (statusFilter === 'fixed' && !c.fixed) return false;
    if (typeFilter !== 'all' && c.cargo.toLowerCase().indexOf(typeFilter) === -1) return false;
    return true;
  });

  // Stats
  const total = cargoData.length;
  const freshCount = cargoData.filter(c => c.fresh).length;
  const fixedCount = cargoData.filter(c => c.fixed).length;
  const fhCount = cargoData.filter(c => c.slot && c.slot.includes('FH')).length;

  document.getElementById('cargoStats').innerHTML = [
    { label: 'Total cargoes', value: total },
    { label: 'Fresh', value: freshCount },
    { label: 'Fixed', value: fixedCount },
    { label: 'FH laycans', value: fhCount },
  ].map(s => `<div class="stat"><div class="stat-label">${s.label}</div><div class="stat-value">${s.value}</div></div>`).join('');

  // Stem filter buttons
  const stemCounts = {};
  cargoData.forEach(c => { stemCounts[c.stem] = (stemCounts[c.stem] || 0) + 1; });
  const stems = STEM_ORDER.filter(s => stemCounts[s]);

  document.getElementById('cargoStemFilters').innerHTML =
    `<button class="filter-pill ${activeCargoStem === 'ALL' ? 'active' : ''}" onclick="setCargoStem('ALL')">All (${total})</button>` +
    stems.map(s =>
      `<button class="filter-pill ${activeCargoStem === s ? 'active' : ''}" onclick="setCargoStem('${s}')">${s} (${stemCounts[s]})</button>`
    ).join('');

  // Legend
  const presentSlots = [...new Set(filtered.map(c => c.slot).filter(Boolean))].sort((a, b) => slotSortKey(a) - slotSortKey(b));
  document.getElementById('cargoLegend').innerHTML =
    presentSlots.map(s => `<span class="legend-item"><span class="legend-dot" style="background:${slotColor(s)}"></span>${s}</span>`).join('') +
    `<span class="legend-item"><span class="legend-line"></span>Running total</span>`;

  // Chart
  renderCargoChart(filtered);

  // Table
  filtered.sort((a, b) => slotSortKey(a.slot) - slotSortKey(b.slot));
  const tbody = document.getElementById('cargoBody');
  tbody.innerHTML = filtered.map(c => {
    const route = c.load && c.disch ? `${c.load} → ${c.disch}` : '';
    let statusBadge = '';
    if (c.fresh) statusBadge = '<span class="badge-fresh">FRESH</span>';
    if (c.fixed) statusBadge = '<span class="badge-fixed">FIXED</span>';
    const slotBadge = c.slot ? `<span class="td-laycan" style="background:${slotColor(c.slot)}20;color:${slotColor(c.slot)}">${c.slot}</span>` : '—';
    return `<tr>
      <td style="font-weight:500">${c.charterer}</td>
      <td style="color:var(--text-dim)">${c.stem}</td>
      <td>${c.cargo}</td>
      <td style="color:var(--text-dim)">${route}</td>
      <td style="font-family:var(--mono);font-size:12px">${c.laycan}</td>
      <td>${slotBadge}</td>
      <td style="font-family:var(--mono)">${c.size}</td>
      <td style="color:var(--text-dim)">${c.updated}</td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join('');
}

function renderCargoChart(filtered) {
  // Group by updated date
  const dateMap = {};
  filtered.forEach(c => {
    const d = c.updated || 'Unknown';
    if (!dateMap[d]) dateMap[d] = [];
    dateMap[d].push(c);
  });

  const dates = Object.keys(dateMap).sort((a, b) => {
    const pa = a.replace(/\s/g, '').toLowerCase();
    const pb = b.replace(/\s/g, '').toLowerCase();
    return pa.localeCompare(pb);
  });

  const slots = [...new Set(filtered.map(c => c.slot).filter(Boolean))].sort((a, b) => slotSortKey(a) - slotSortKey(b));

  const barDatasets = slots.map(slot => ({
    label: slot,
    data: dates.map(d => dateMap[d].filter(c => c.slot === slot).length),
    backgroundColor: slotColor(slot),
    stack: 'a',
    order: 2,
  }));

  // Running total
  let cumulative = 0;
  const runningTotal = dates.map(d => {
    cumulative += dateMap[d].length;
    return cumulative;
  });

  const lineDataset = {
    label: 'Running total',
    data: runningTotal,
    type: 'line',
    borderColor: '#E24B4A',
    backgroundColor: '#E24B4A',
    pointRadius: 4,
    pointBackgroundColor: '#E24B4A',
    borderWidth: 2,
    fill: false,
    order: 1,
    tension: 0.1,
  };

  const ctx = document.getElementById('cargoChart');
  if (cargoChart) cargoChart.destroy();

  cargoChart = new Chart(ctx, {
    type: 'bar',
    data: { labels: dates, datasets: [...barDatasets, lineDataset] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: ctx => 'Added: ' + ctx[0].label,
            label: ctx => ctx.raw > 0 ? ` ${ctx.dataset.label}: ${ctx.raw}` : null,
            filter: item => item.raw > 0,
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { autoSkip: false } },
        y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } },
      }
    }
  });
}

function setCargoStem(stem) {
  activeCargoStem = stem;
  renderCargo();
}

function parseCargoPaste() {
  const text = document.getElementById('cargoInput').value.trim();
  if (!text) return;
  cargoData = parseCargoData(text);
  saveCargo();
  renderCargo();
}

function clearCargo() {
  cargoData = [];
  saveCargo();
  document.getElementById('cargoInput').value = '';
  document.getElementById('cargoBody').innerHTML = '';
  document.getElementById('cargoStats').innerHTML = '';
  document.getElementById('cargoStemFilters').innerHTML = '';
  document.getElementById('cargoLegend').innerHTML = '';
  if (cargoChart) { cargoChart.destroy(); cargoChart = null; }
}

// Init cargo if data exists
if (cargoData.length > 0 && document.getElementById('tab-cargo').classList.contains('active')) {
  renderCargo();
}

</script>
