<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panamax Tonnage Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --bg:#FFFFFF;--bg2:#FFFFFF;--bg3:#F5F5F3;--bg-hover:#EFEFED;
    --border:#E0E0E0;--border2:#CCCCCC;
    --text:#1A1A1A;--text-dim:#888888;--text-bright:#000000;
    --accent:#185FA5;--accent-light:#EEF4FC;--accent-hover:#124D8A;
    --green:#3B6D11;--green-light:#EAF3DE;--green-border:#B6D98A;
    --amber:#BA7517;--amber-light:#FAEEDA;--amber-border:#F0C97A;
    --red:#A32D2D;--red-light:#FAEAEA;--red-border:#E8A0A0;
    --blue:#185FA5;--blue-light:#EEF4FC;--blue-border:#A0C0E8;
    --teal:#185FA5;--teal-light:#EEF4FC;--teal-border:#A0C0E8;
    --mono:'JetBrains Mono',monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
    --radius:8px;--radius-sm:6px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 1px 3px rgba(0,0,0,.1),0 1px 2px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body,table,input,button,textarea,select{font-family:var(--sans)}
  body{background:var(--bg);color:var(--text);font-size:13px;min-height:100vh;-webkit-font-smoothing:antialiased}

  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 28px 16px}
  .header-top{display:flex;align-items:center;gap:20px;margin-bottom:16px}
  .header-title{font-weight:700;font-size:18px;color:var(--text-bright);letter-spacing:-.4px}
  .header-subtitle{font-size:12px;color:var(--text-dim);font-weight:400}
  .header-stats{display:flex;gap:12px;margin-bottom:16px}
  .stat{padding:12px 20px;background:var(--bg3);border-radius:var(--radius);border:1px solid var(--border);min-width:100px}
  .stat-value{font-family:var(--sans);font-size:28px;font-weight:500;color:var(--text-bright);line-height:1;letter-spacing:-.3px}
  .stat-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-weight:500;margin-bottom:4px}

  .filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .filter-pill{font-size:13px;font-weight:500;padding:7px 16px;border-radius:20px;border:1px solid var(--border);background:var(--bg2);color:var(--text);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
  .filter-pill:hover{border-color:var(--accent);color:var(--accent)}
  .filter-pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .filter-count{font-size:11px;opacity:.7}

  .controls-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .toolbar-label{font-size:12px;color:var(--text-dim);font-weight:500}
  .date-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:7px 12px;outline:none;width:140px}
  .date-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
  .search-input{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;padding:7px 14px;outline:none;width:220px}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
  .spacer{flex:1}

  .layout{display:grid;grid-template-columns:var(--inbox-width, 380px) 6px 1fr;height:calc(100vh - 220px)}
  .divider{background:var(--border);cursor:col-resize;position:relative;transition:background .15s}
  .divider:hover,.divider.dragging{background:var(--accent)}
  .divider::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:32px;background:var(--border2);border-radius:1px}
  .divider:hover::after,.divider.dragging::after{background:#fff}
  .panel-inbox{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column}
  .panel-title{padding:16px 20px;font-size:11px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .panel-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .inbox-area{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;overflow:hidden}

  textarea#rawInput{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--mono);font-size:11px;line-height:1.8;padding:14px;resize:none;outline:none;transition:border-color .2s,box-shadow .2s}
  textarea#rawInput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
  textarea#rawInput::placeholder{color:var(--text-dim)}
  .inbox-controls{display:flex;gap:8px}

  button{font-family:var(--sans);font-size:12px;font-weight:500;border:none;border-radius:var(--radius-sm);cursor:pointer;padding:9px 18px;transition:all .15s}
  .btn-primary{background:var(--accent);color:#fff;flex:1}
  .btn-primary:hover{background:var(--accent-hover)}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-add{background:var(--accent);color:#fff;flex:1;opacity:.85}
  .btn-add:hover{background:var(--accent-hover);opacity:1}
  .btn-add:disabled{opacity:.4;cursor:not-allowed}
  .btn-secondary{background:var(--bg2);color:var(--text-dim);border:1px solid var(--border)}
  .btn-secondary:hover{border-color:var(--accent);color:var(--accent)}

  .preview-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;font-family:var(--mono);font-size:10px;color:var(--text-dim);max-height:140px;overflow-y:auto;line-height:1.6;white-space:pre-wrap}
  .preview-box.has-content{color:var(--green);border-color:var(--green-border);background:var(--green-light)}
  .preview-box.has-error{color:var(--red);border-color:var(--red-border);background:var(--red-light)}

  .panel-board{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

  .table-wrapper{flex:1;overflow:auto;padding:0 12px 12px}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  thead th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.3px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;transition:color .1s}
  thead th:hover{color:var(--accent)}
  thead th.col-p6{color:var(--accent)}
  thead th.col-fixed{color:var(--amber)}
  tbody tr{transition:background .1s}
  tbody tr:hover{background:var(--bg-hover)}
  tbody tr td{border-bottom:1px solid var(--border)}
  td{padding:10px 14px;white-space:nowrap;vertical-align:middle}

  /* Group header rows — bold period breaks */
  .group-header td{font-size:12px;font-weight:700;padding:12px 14px;letter-spacing:.3px;border-bottom:2px solid!important;border-top:2px solid!important}
  .group-color-0 td{background:#EEF4FC;color:#185FA5;border-color:#A8C8E8!important}
  .group-color-1 td{background:#F0F4F8;color:#2D5A7A;border-color:#9BB5CC!important}
  .group-color-2 td{background:#F5F5F3;color:#4A5568;border-color:#BBBBBB!important}
  .group-color-3 td{background:#F7F4EF;color:#7A5C2D;border-color:#C8B898!important}
  .group-color-4 td{background:#EEF6F3;color:#2D6B5A;border-color:#9BC8B8!important}
  .group-color-5 td{background:#F5F2F7;color:#5A3E7A;border-color:#C0A8D8!important}

  .td-vessel{font-weight:600;color:var(--text-bright);font-size:13px}
  .td-owner{font-size:12px;color:var(--text);font-weight:500}
  .td-source{font-size:12px;color:var(--text-dim)}
  .td-specs{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  .td-port{font-weight:500;font-size:12px;color:var(--amber)}
  .td-date{font-family:var(--mono);font-size:12px;color:var(--text)}
  .td-eta{font-family:var(--mono);font-size:12px}
  .td-laycan{font-size:11px;font-weight:600;padding:4px 10px;border-radius:4px;display:inline-block}
  .laycan-color-0{background:#D6E8F7;color:#185FA5}
  .laycan-color-1{background:#D8E8F2;color:#2D5A7A}
  .laycan-color-2{background:#E8E8E5;color:#4A5568}
  .laycan-color-3{background:#EDE6D8;color:#7A5C2D}
  .laycan-color-4{background:#D8EDE8;color:#2D6B5A}
  .laycan-color-5{background:#E8E0F0;color:#5A3E7A}
  .onw-badge{font-size:10px;font-weight:600;background:var(--amber-light);color:var(--amber);padding:2px 8px;border-radius:4px;margin-left:5px}
  .td-p6{font-family:var(--mono);font-weight:600;font-size:13px}
  .td-p6 .bid{color:var(--green)}
  .td-p6 .offer{color:var(--red)}
  .td-spread{font-family:var(--mono);font-size:12px;font-weight:500}
  .spread-pos{color:var(--red)}
  .spread-neg{color:var(--green)}
  .spread-zero{color:var(--text-dim)}
  .td-fixed{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--amber)}

  /* Row shading — FH lighter, LH slightly deeper, unified blue tint */
  .laycan-fh-jan td,.laycan-fh-feb td,.laycan-fh-mar td,.laycan-fh-apr td,.laycan-fh-may td,.laycan-fh-jun td,
  .laycan-fh-jul td,.laycan-fh-aug td,.laycan-fh-sep td,.laycan-fh-oct td,.laycan-fh-nov td,.laycan-fh-dec td{background:rgba(24,95,165,.02)}
  .laycan-lh-jan td,.laycan-lh-feb td,.laycan-lh-mar td,.laycan-lh-apr td,.laycan-lh-may td,.laycan-lh-jun td,
  .laycan-lh-jul td,.laycan-lh-aug td,.laycan-lh-sep td,.laycan-lh-oct td,.laycan-lh-nov td,.laycan-lh-dec td{background:rgba(24,95,165,.045)}

  .status-badge{font-size:11px;padding:4px 12px;border-radius:4px;font-weight:600;cursor:pointer;transition:opacity .15s;display:inline-block}
  .status-badge:hover{opacity:.75}
  .status-OPEN{background:var(--green-light);color:var(--green)}
  .status-FIXED{background:var(--blue-light);color:var(--blue)}
  .status-FAILED{background:var(--red-light);color:var(--red)}
  .status-WITHDRAWN{background:var(--bg3);color:var(--text-dim)}
  .status-ON_SUBS{background:var(--amber-light);color:var(--amber)}

  .scrubber-yes{color:var(--green);font-weight:600}
  .scrubber-unk{color:var(--border2)}
  .empty-state{text-align:center;padding:100px 20px;color:var(--text-dim);font-size:14px;line-height:1.6}
  .warn-dot{display:inline-block;width:6px;height:6px;background:var(--amber);border-radius:50%;margin-left:5px;vertical-align:middle}

  .editable{cursor:text;border-radius:3px;padding:2px 4px;margin:-2px -4px;transition:background .12s}
  .editable:hover{background:rgba(24,95,165,.06)}
  .edit-input{font-family:inherit;font-size:inherit;font-weight:inherit;color:inherit;background:var(--bg2);border:2px solid var(--accent);border-radius:4px;padding:3px 8px;outline:none;box-shadow:0 0 0 3px rgba(24,95,165,.1);width:100%;min-width:50px}
  .edit-input.mono{font-family:var(--mono)}

  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}

  .btn-remove{background:none;border:1px solid var(--border);color:var(--text-dim);padding:4px 10px;font-size:11px;border-radius:var(--radius-sm)}
  .btn-remove:hover{border-color:var(--red);color:var(--red);background:var(--red-light)}

  /* Mode toggle */
  .mode-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-left:auto}
  .mode-btn{background:none;border:none;padding:4px 12px;font-size:11px;font-weight:500;color:var(--text-dim);cursor:pointer;border-radius:0;transition:all .15s}
  .mode-btn.active{background:var(--accent);color:#fff}

  /* Manual entry form */
  .manual-form{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form-row.full{grid-template-columns:1fr}
  .form-group{display:flex;flex-direction:column;gap:3px}
  .form-label{font-size:10px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
  .form-input{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:6px 10px;outline:none;width:100%}
  .form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
  .form-select{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:12px;padding:6px 10px;outline:none;width:100%;cursor:pointer}
  .form-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(24,95,165,.1)}

  /* Column drag-and-drop */
  thead th{cursor:grab}
  thead th:active{cursor:grabbing}
  thead th.drag-over{border-left:3px solid var(--accent)!important}
  thead th.dragging{opacity:.4}

  /* Tab system */
  .tab-bar{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:0;background:var(--bg2);padding:0 28px}
  .tab-btn{padding:12px 24px;font-size:13px;font-weight:600;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s;letter-spacing:.2px}
  .tab-btn:hover{color:var(--text)}
  .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* Cargo book styles */
  .cargo-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:20px 28px 16px}
  .cargo-stats{display:flex;gap:12px;margin-bottom:16px}
  .cargo-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .cargo-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .cargo-chart-wrap{padding:0 28px;height:340px;margin-bottom:16px}
  .cargo-legend{display:flex;flex-wrap:wrap;gap:12px;padding:0 28px;margin-bottom:12px;align-items:center}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dim)}
  .legend-dot{width:10px;height:10px;border-radius:2px}
  .legend-line{width:16px;height:2px;background:#E24B4A;border-radius:1px}
  .cargo-table-wrap{overflow:auto;padding:0 28px 20px}
  .cargo-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
  .cargo-table thead th{background:var(--bg3);padding:10px 14px;text-align:left;font-size:11px;font-weight:600;color:var(--text-dim);letter-spacing:.3px;border-bottom:1px solid var(--border2);white-space:nowrap;position:sticky;top:0}
  .cargo-table tbody tr{transition:background .1s}
  .cargo-table tbody tr:hover{background:var(--bg-hover)}
  .cargo-table tbody td{padding:8px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
  .badge-fresh{background:var(--green-light);color:var(--green);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
  .badge-fixed{background:var(--amber-light);color:var(--amber);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600}
  .cargo-paste-area{padding:20px 28px}
  .cargo-paste-area textarea{width:100%;height:200px;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:11px;line-height:1.6;padding:14px;resize:vertical;outline:none}
  .cargo-paste-area textarea:focus{border-color:var(--accent)}
</style>
</head>
<body>

<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('tonnage')">Tonnage Board</button>
  <button class="tab-btn" onclick="switchTab('cargo')">Cargo Book</button>
</div>

<div id="tab-tonnage" class="tab-panel active">
<header class="header">
  <div class="header-top">
    <div>
      <div class="header-title">Panamax Tonnage Tracker</div>
      <div class="header-subtitle">Arrow Shipbroking — Geneva Atlantic Desk</div>
    </div>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-label">Total vessels</div><div class="stat-value" id="statTotal">0</div></div>
    <div class="stat"><div class="stat-label">Open</div><div class="stat-value" id="statOpen">0</div></div>
    <div class="stat"><div class="stat-label">On Subs</div><div class="stat-value" id="statSubs">0</div></div>
    <div class="stat"><div class="stat-label">Fixed</div><div class="stat-value" id="statFixed">0</div></div>
  </div>
  <div class="filter-row" id="statusFilters">
    <button class="filter-pill active" data-filter="ALL" onclick="toggleFilter('ALL')">All <span class="filter-count" id="cntAll"></span></button>
    <button class="filter-pill" data-filter="OPEN" onclick="toggleFilter('OPEN')">Open <span class="filter-count" id="cntOpen"></span></button>
    <button class="filter-pill" data-filter="ON SUBS" onclick="toggleFilter('ON SUBS')">On Subs <span class="filter-count" id="cntSubs"></span></button>
    <button class="filter-pill" data-filter="FIXED" onclick="toggleFilter('FIXED')">Fixed <span class="filter-count" id="cntFixed"></span></button>
    <button class="filter-pill" data-filter="FAILED" onclick="toggleFilter('FAILED')">Failed <span class="filter-count" id="cntFailed"></span></button>
    <button class="filter-pill" data-filter="WITHDRAWN" onclick="toggleFilter('WITHDRAWN')">Withdrawn <span class="filter-count" id="cntWithdrawn"></span></button>
  </div>
  <div class="controls-row">
    <span class="toolbar-label">ETA</span>
    <input type="date" class="date-input" id="etaFrom" onchange="renderTable()">
    <span class="toolbar-label">to</span>
    <input type="date" class="date-input" id="etaTo" onchange="renderTable()">
    <button class="filter-pill" onclick="clearDateFilter()" style="font-size:11px;padding:5px 12px">Clear</button>
    <div class="spacer"></div>
    <input class="search-input" id="searchInput" placeholder="Search vessel / owner..." oninput="renderTable()">
    <div style="position:relative">
      <button class="filter-pill" onclick="toggleColumnMenu()" style="font-size:11px;padding:5px 12px">Columns</button>
      <div id="columnMenu" style="display:none;position:absolute;right:0;top:36px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;z-index:10;box-shadow:var(--shadow);min-width:170px"></div>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="panel-inbox">
    <div class="panel-title">
      <span class="dot"></span>
      <span id="panelTitleText">WhatsApp Inbox</span>
      <div class="mode-toggle">
        <button class="mode-btn active" id="modeParseBtn" onclick="setMode('parse')">Parse</button>
        <button class="mode-btn" id="modeManualBtn" onclick="setMode('manual')">Manual</button>
      </div>
    </div>

    <!-- Parse mode -->
    <div class="inbox-area" id="parsePanel">
      <textarea id="rawInput" placeholder="Paste WhatsApp tonnage messages here.

Example:
QUADRA - MV SAKIZAYA MIRACLE (81/17) GOA 31 MARCH / ETA 25 APR ONW
BOD ABT 1250/240
= ECSA FH: Claims seeing 20k multiple times vs 21,500 (p6: 16,700 vs 18k)"></textarea>
      <div id="previewBox" class="preview-box">Parsed output will appear here</div>
      <div class="inbox-controls">
        <button class="btn-primary" id="btnParse" onclick="handleParse()">Parse (AI)</button>
        <button class="btn-add" id="btnAdd" onclick="handleAdd()" disabled>Add to Board</button>
        <button class="btn-secondary" onclick="handleClear()">Clear</button>
        <button class="btn-secondary" onclick="loadSample()">Sample</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="password" class="search-input" id="apiKeyInput" placeholder="Anthropic API Key" style="flex:1;font-size:10px" onchange="saveApiKey(this.value)">
        <button class="btn-secondary" style="padding:5px 10px;font-size:10px" onclick="toggleKeyVisibility()">Show</button>
        <button class="btn-secondary" style="padding:5px 10px;font-size:10px" onclick="handleParseRegex()">Regex</button>
      </div>
    </div>

    <!-- Manual entry mode -->
    <div class="inbox-area" id="manualPanel" style="display:none">
      <div class="manual-form" id="manualForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Vessel Name</label>
            <input class="form-input" id="mf_vessel_name" placeholder="SAKIZAYA MIRACLE">
          </div>
          <div class="form-group">
            <label class="form-label">Owner</label>
            <input class="form-input" id="mf_owner" placeholder="QUADRA">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">DWT (K)</label>
            <input class="form-input" id="mf_dwt" placeholder="81" type="number">
          </div>
          <div class="form-group">
            <label class="form-label">Built</label>
            <input class="form-input" id="mf_build_year" placeholder="2017" type="number">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Position / Port</label>
            <input class="form-input" id="mf_current_position" placeholder="GOA">
          </div>
          <div class="form-group">
            <label class="form-label">Delivery Basis</label>

<script>
// ─── Panamax Tonnage Parser ──────────────────────────────────────────────────
// Parses WhatsApp tonnage messages into structured vessel objects.
// Handles the wide variety of formats seen across brokers and owners.

const MONTH_MAP = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12,
  march:3,april:4,june:6,july:7};
const CURRENT_YEAR = new Date().getFullYear();

// ─── Utility Parsers ─────────────────────────────────────────────────────────

function parseRate(str, context) {
  if (!str) return null;
  const s = str.replace(/,/g, '').trim().toLowerCase();
  // "20k" → 20000, "1.5k" → 1500
  const kMatch = s.match(/^(\d+(?:\.\d+)?)k$/);
  if (kMatch) return Math.round(parseFloat(kMatch[1]) * 1000);
  // "1m" or "1.025m" → 1000000 / 1025000
  const mMatch = s.match(/^(\d+(?:\.\d+)?)m$/);
  if (mMatch) return Math.round(parseFloat(mMatch[1]) * 1000000);
  const plain = parseFloat(s);
  if (isNaN(plain)) return null;
  // Context-aware scaling for bare numbers:
  // TC rates: bare "18" or "19.5" in market colour context → 18,000 / 19,500
  if (context === 'tc' && plain > 0 && plain < 100) return Math.round(plain * 1000);
  // BB lump sums: "975" → 975,000; "1.025" → 1,025,000
  if (context === 'bb') {
    if (plain > 0 && plain < 10) return Math.round(plain * 1000000);   // 1.025 → 1,025,000
    if (plain >= 10 && plain < 10000) return Math.round(plain * 1000); // 975 → 975,000
  }
  return plain;
}

function parseDate(str) {
  if (!str) return null;
  const clean = str.trim().toLowerCase().replace(/[.,]/g, '');
  // Handle "19 MAR", "31 MARCH", "15 APR 2026"
  const match = clean.match(/(\d{1,2})\s+([a-z]+)(?:\s+(\d{4}))?/);
  if (!match) return null;
  const day = parseInt(match[1], 10);
  const monthStr = match[2].slice(0, 3);
  const month = MONTH_MAP[monthStr] || MONTH_MAP[match[2]];
  const year = match[3] ? parseInt(match[3], 10) : CURRENT_YEAR;
  if (!month || day < 1 || day > 31) return null;
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

// Parse range dates like "10-15 APR", "8-9 APR", "16-18 APR"
// Returns { earliest: "2026-04-10", latest: "2026-04-15" }
function parseDateRange(str) {
  if (!str) return null;
  const clean = str.trim().toLowerCase().replace(/[.,]/g, '');
  // "10-15 apr" or "8-9 apr"
  const rangeMatch = clean.match(/(\d{1,2})\s*[-\/]\s*(\d{1,2})\s+([a-z]+)(?:\s+(\d{4}))?/);
  if (rangeMatch) {
    const day1 = parseInt(rangeMatch[1], 10);
    const day2 = parseInt(rangeMatch[2], 10);
    const monthStr = rangeMatch[3].slice(0, 3);
    const month = MONTH_MAP[monthStr] || MONTH_MAP[rangeMatch[3]];
    const year = rangeMatch[4] ? parseInt(rangeMatch[4], 10) : CURRENT_YEAR;
    if (!month) return null;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      earliest: `${year}-${pad(month)}-${pad(day1)}`,
      latest: `${year}-${pad(month)}-${pad(day2)}`
    };
  }
  // Single date fallback
  const single = parseDate(str);
  if (single) return { earliest: single, latest: single };
  return null;
}

function detectScrubber(text) {
  if (/\bscr(ubber)?\b|\+s\b/i.test(text)) return true;
  return null;
}

// ─── Laycan Period Helpers ───────────────────────────────────────────────────

function getLaycanPeriod(isoDate) {
  if (!isoDate) return null;
  const [y, m, d] = isoDate.split('-').map(Number);
  const months = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const half = d <= 15 ? 'FH' : 'LH';
  return `${half} ${months[m]}`;
}

function laycanSortKey(isoDate) {
  if (!isoDate) return '9999-99-99';
  return isoDate;
}

// ─── Vessel Line Parser ──────────────────────────────────────────────────────

function parseVesselLine(line) {
  const result = {
    source: null, owner: null, vessel_name: null, dwt: null, build_year: null,
    draft: null, scrubber: null, current_position: null, open_date: null, open_date_end: null,
    eta_ecsa: null, eta_ecsa_end: null, eta_type: null, delivery_basis: null
  };

  // "WITH BROKER" prefix: "WITH QUADRA MV ..." → source is QUADRA
  const withMatch = line.match(/^WITH\s+(\S+)\s+/i);
  if (withMatch) {
    result.source = withMatch[1].trim();
    line = line.slice(withMatch[0].length).trim();
  }

  // Find MV/MT position to help locate vessel name vs source
  const mvPos = line.search(/\bM[VT]\s/i);

  // Source/broker before " - " BUT only if the dash comes before MV,
  // or if there's no MV at all
  const dashIdx = line.indexOf(' - ');
  if (dashIdx !== -1) {
    const afterDash = line.slice(dashIdx + 3).trim();
    const mvAfterDash = /^M[VT]\s/i.test(afterDash);
    const dashIsBeforeMV = mvPos === -1 || dashIdx < mvPos;
    // It's a specs-to-port separator if: specs parens end right before dash AND no MV after dash
    const dashIsSpecsToPort = !mvAfterDash && dashIdx > 0 && /\)\s*$/.test(line.slice(0, dashIdx).trim());

    if ((dashIsBeforeMV || mvAfterDash) && !dashIsSpecsToPort) {
      // Normal: "BAUMARINE - MV SILVERMINE..." or "BAUMARINE (note) - MV SILVERMINE..."
      let src = line.slice(0, dashIdx).trim();
      const srcAnnotation = src.match(/\(([^)]+)\)/);
      if (srcAnnotation) {
        result.source_note = srcAnnotation[1].trim();
        src = src.replace(srcAnnotation[0], '').trim();
      }
      if (!result.source) result.source = src;
      line = line.slice(dashIdx + 3);
    }
  }

  // Extended specs in parens: (81'688DWT ON 14.469 BUILT 2017) or (82,225DWT ON 14.47M BUILT 2013)
  const extSpecMatch = line.match(/\((\d[\d',.]*)(?:\s*DWT)?(?:\s+ON\s+(\d+(?:\.\d+)?)(?:M)?)?\s*(?:BUILT\s+(\d{4}))?\)/i);
  if (extSpecMatch) {
    const dwtStr = extSpecMatch[1].replace(/[',]/g, '');
    const dwtRaw = parseInt(dwtStr, 10);
    if (!isNaN(dwtRaw)) result.dwt = dwtRaw < 1000 ? dwtRaw * 1000 : dwtRaw;
    if (extSpecMatch[2]) result.draft = parseFloat(extSpecMatch[2]);
    if (extSpecMatch[3]) result.build_year = parseInt(extSpecMatch[3], 10);
    line = line.replace(extSpecMatch[0], '').trim();
    // If there's a " - " right after specs, consume it
    line = line.replace(/^\s*-\s*/, '').trim();
  }

  // Standard short specs: (81/17), (82/2013), (77095/14)
  if (!result.dwt) {
    const sizeMatch = line.match(/\((\d+(?:,\d+)?)\/(\d{2,4})\)/);
    if (sizeMatch) {
      const dwtRaw = parseInt(sizeMatch[1].replace(/,/g, ''), 10);
      result.dwt = dwtRaw < 1000 ? dwtRaw * 1000 : dwtRaw;
      const yearRaw = parseInt(sizeMatch[2], 10);
      result.build_year = yearRaw < 100 ? 2000 + yearRaw : yearRaw;
      line = line.replace(sizeMatch[0], '').trim();
    }
  }

  // Scrubber detection
  result.scrubber = detectScrubber(line);
  line = line.replace(/\bscr(ubber)?\b|\+s\b/gi, '').trim();

  // ETA extraction: "/ ETA 25 APR ONW" or "/ ETA ECSA 11 MAY ONW" or "/ ETA SANTOS 13 APR"
  const etaMatch = line.match(/\/\s*ETA\s+(?:(?:ECSA|SANTOS|PARANAGUA|TUBARAO)\s+)?(.+)$/i);
  if (etaMatch) {
    const etaStr = etaMatch[1].trim();
    const onw = /\bonw\b/i.test(etaStr);
    result.eta_type = onw ? 'ONW' : 'EXACT';
    const cleanEta = etaStr.replace(/\bonw\b/gi, '').trim();
    const dateRange = parseDateRange(cleanEta);
    if (dateRange) {
      result.eta_ecsa = dateRange.earliest;
      result.eta_ecsa_end = dateRange.latest !== dateRange.earliest ? dateRange.latest : null;
    }
    line = line.slice(0, line.search(/\/\s*ETA/i)).trim();
  }

  // Remove MV/MT prefix (handle "MVNavios" with no space too)
  line = line.replace(/^M[VT]\s*/i, '').trim();

  // Delivery basis: APS ECSA, APS SANTOS, DLOSP, SANTOS, PARANAGUA etc.
  const deliveryMatch = line.match(/\b(APS\s+\w+|DLOSP|PASSING\s+\w+)\b/i);
  if (deliveryMatch) {
    result.delivery_basis = deliveryMatch[1].toUpperCase();
    line = line.replace(deliveryMatch[0], '').replace(/\s{2,}/g, ' ').trim();
  }

  // Open date (possibly range): "GANGAVARAM 19 MAR", "PARADIP 10-15 APR"
  const rangeDatePattern = /(\d{1,2}\s*[-\/]\s*\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*)/gi;
  const singleDatePattern = /(\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*)/gi;

  let dateMatches = [...line.matchAll(rangeDatePattern)];
  if (dateMatches.length > 0) {
    const lastDate = dateMatches[dateMatches.length - 1];
    const range = parseDateRange(lastDate[0]);
    if (range) {
      result.open_date = range.earliest;
      result.open_date_end = range.latest !== range.earliest ? range.latest : null;
    }
    const beforeDate = line.slice(0, lastDate.index).trim();
    const parts = beforeDate.split(/\s+/).filter(Boolean);
    if (parts.length >= 1) {
      result.current_position = parts[parts.length - 1];
      result.vessel_name = parts.slice(0, parts.length - 1).join(' ') || beforeDate;
    }
  } else {
    dateMatches = [...line.matchAll(singleDatePattern)];
    if (dateMatches.length > 0) {
      const lastDate = dateMatches[dateMatches.length - 1];
      result.open_date = parseDate(lastDate[0]);
      const beforeDate = line.slice(0, lastDate.index).trim();
      const parts = beforeDate.split(/\s+/).filter(Boolean);
      if (parts.length >= 1) {
        result.current_position = parts[parts.length - 1];
        result.vessel_name = parts.slice(0, parts.length - 1).join(' ') || beforeDate;
      }
    } else {
      // No date found — try to extract port from end
      const parts = line.trim().split(/\s+/).filter(Boolean);
      if (parts.length > 1 && /^[A-Z]+$/.test(parts[parts.length - 1]) && parts[parts.length - 1].length <= 12) {
        // Check if last word looks like a port/delivery
        const lastWord = parts[parts.length - 1];
        const knownPorts = ['SANTOS', 'PARANAGUA', 'TUBARAO', 'SINGAPORE', 'GOA', 'HALDIA', 'GANGAVARAM', 'PARADIP', 'ENNORE', 'HAZIRA', 'MUNDRA', 'KANDLA'];
        if (knownPorts.includes(lastWord)) {
          result.current_position = lastWord;
          result.vessel_name = parts.slice(0, parts.length - 1).join(' ');
        } else {
          result.vessel_name = line.trim() || null;
        }
      } else {
        result.vessel_name = line.trim() || null;
      }
    }
  }

  // Clean vessel name
  if (result.vessel_name) {
    result.vessel_name = result.vessel_name.replace(/^\s*[-/]\s*|\s*[-/]\s*$/g, '').trim();
    // If delivery_basis wasn't caught earlier but vessel name ends with port
    if (!result.delivery_basis && result.current_position) {
      const port = result.current_position.toUpperCase();
      if (['SANTOS', 'PARANAGUA'].includes(port)) {
        result.delivery_basis = port;
      }
    }
  }

  return result;
}

// ─── BOD Line Parser ─────────────────────────────────────────────────────────

function parseBODLine(line) {
  const result = { bod_ifo: null, bod_mdo: null, bod_basis: null, bod_fuel_type: null };

  // Extract basis: "BSS SANTOS", "BSS ENNORE", "bss Santos"
  const basisMatch = line.match(/\bbss\s+([A-Za-z]+)/i);
  if (basisMatch) {
    result.bod_basis = basisMatch[1].toUpperCase();
  }

  // Detect fuel type: LSFO/LSMGO vs IFO/MDO (default)
  if (/\bLSFO\b/i.test(line)) {
    result.bod_fuel_type = 'LSFO/LSMGO';
  }

  // Handle ranges: "1400-1500 / 180-200" → take midpoint
  const rangeMatch = line.match(/(\d+(?:,\d+)?)\s*[-–]\s*(\d+(?:,\d+)?)\s*\/\s*(\d+(?:,\d+)?)\s*[-–]\s*(\d+(?:,\d+)?)/);
  if (rangeMatch) {
    const v1 = parseFloat(rangeMatch[1].replace(/,/g, ''));
    const v2 = parseFloat(rangeMatch[2].replace(/,/g, ''));
    const v3 = parseFloat(rangeMatch[3].replace(/,/g, ''));
    const v4 = parseFloat(rangeMatch[4].replace(/,/g, ''));
    result.bod_ifo = Math.round((v1 + v2) / 2);
    result.bod_mdo = Math.round((v3 + v4) / 2);
    return result;
  }

  // Handle fuel-type prefix: "LSFO 670 / LSMGO 185"
  const fuelMatch = line.match(/(?:LSFO|IFO|HFO)?\s*(\d+(?:,\d+)?(?:\.\d+)?)\s*\/\s*(?:LSMGO|MDO|MGO)?\s*(\d+(?:,\d+)?(?:\.\d+)?)/i);
  if (fuelMatch) {
    result.bod_ifo = parseFloat(fuelMatch[1].replace(/,/g, ''));
    result.bod_mdo = parseFloat(fuelMatch[2].replace(/,/g, ''));
    return result;
  }

  // Standard: "BOD ABT 1250/240"
  const stdMatch = line.match(/(\d+(?:,\d+)?(?:\.\d+)?)\s*\/\s*(\d+(?:,\d+)?(?:\.\d+)?)/);
  if (stdMatch) {
    result.bod_ifo = parseFloat(stdMatch[1].replace(/,/g, ''));
    result.bod_mdo = parseFloat(stdMatch[2].replace(/,/g, ''));
  }

  return result;
}

// ─── Market Colour Line Parser ───────────────────────────────────────────────

function parseMarketColourLine(line) {
  line = line.replace(/^[=\s]+/, '').trim();

  let route = null;
  let bid_usd = null;
  let offer_usd = null;
  let bb_usd = null;
  let bid_bb_usd = null;
  let bid_multiple_claims = false;
  let p6_bid = null;
  let p6_offer = null;
  let delivery_basis = null;
  let offer_date = null;
  let is_bid = false;
  let is_idea = false;
  let notes = null;

  // Detect if this is a bid line: "Bidding here MV XXX @ 19k..."
  if (/\bbid(ding|s)?\b/i.test(line)) {
    is_bid = true;
  }

  // Route detection: "ECSA FH:", "Friday:" (day = timing note), "Pref ECSA FH"
  // Find first colon that is NOT inside parentheses (avoid splitting on "p6:" inside parens)
  let colonIdx = -1;
  let parenDepth = 0;
  for (let ci = 0; ci < line.length && ci < 40; ci++) {
    if (line[ci] === '(') parenDepth++;
    else if (line[ci] === ')') parenDepth--;
    else if (line[ci] === ':' && parenDepth === 0) { colonIdx = ci; break; }
  }
  if (colonIdx !== -1 && colonIdx < 30) {
    const beforeColon = line.slice(0, colonIdx).trim().toUpperCase();
    // Check if it's a known route or timing reference
    const routePatterns = ['ECSA FH', 'ECSA TA', 'USG FH', 'USG TA', 'NCSA FH', 'USEC TA', 'WAFR', 'BSEA', 'MED'];
    const matchedRoute = routePatterns.find(r => beforeColon.includes(r));
    if (matchedRoute) {
      route = matchedRoute;
    } else if (/PREF/i.test(beforeColon)) {
      const prefRoute = routePatterns.find(r => beforeColon.includes(r));
      if (prefRoute) route = prefRoute;
    }
    // Keep non-route prefix as timing note
    if (!route && /^(MON|TUE|WED|THU|FRI|SAT|SUN|MONDAY|TUESDAY|WEDNESDAY|THURSDAY|FRIDAY|SATURDAY|SUNDAY)/i.test(beforeColon)) {
      notes = `(${line.slice(0, colonIdx).trim()})`;
    }
    line = line.slice(colonIdx + 1).trim();
  }

  // "Pref ECSA FH" without colon
  if (!route) {
    const prefMatch = line.match(/\bpref\s+(ECSA\s+FH|ECSA\s+TA|USG\s+FH)/i);
    if (prefMatch) route = prefMatch[1].toUpperCase();
  }

  // Default route for ECSA-related content
  if (!route && /\b(ECSA|Santos|Paranagua|China|Qingdao)\b/i.test(line)) {
    route = 'ECSA FH';
  }

  // "multiple times"
  bid_multiple_claims = /multiple\s+times/i.test(line);

  // P6 extraction — multiple formats:
  // "(p6: 16,700 vs 18k)", "(p6: 17,150)", "(p6 assuming 18,250 = 19,300)"
  // "(p6 bss 18750 offer = 18,500)"
  let p6Match = line.match(/\(\s*p6\s*(?::\s*)?([0-9k,.]+)\s+vs\s+([0-9k,.]+)\s*\)/i);
  if (p6Match) {
    // "(p6: 16,700 vs 18k)" → bid vs offer
    p6_bid = parseRate(p6Match[1].trim());
    p6_offer = parseRate(p6Match[2].trim());
    line = line.replace(p6Match[0], '').trim();
  } else {
    // Match patterns with = sign: "(p6 assuming 18,250 = 19,300)" or "(p6 bss 18750 offer = 18,500)"
    p6Match = line.match(/\(\s*p6\s*[^)]*?=\s*([0-9k,.]+)\s*(?:…|\.{3})?\s*\)/i);
    if (p6Match) {
      p6_offer = parseRate(p6Match[1].trim());
      line = line.replace(p6Match[0], '').trim();
    } else {
      // "(p6: 17,150)" — single value
      p6Match = line.match(/\(\s*p6\s*(?::\s*)?([0-9k,.]+)\s*\)/i);
      if (p6Match) {
        const val = parseRate(p6Match[1].trim());
        if (is_bid) { p6_bid = val; } else { p6_offer = val; }
        line = line.replace(p6Match[0], '').trim();
      }
    }
  }

  // TC + BB pattern: "19k + 900k" or "19,750 + 975" or "19600+1.025m"
  // Format: TC_RATE + BB_LUMPSUM [bss BASIS] [from DATE]
  const tcBbMatch = line.match(/(?:offers?\s+|was\s+|@\s*)?([0-9k,.]+)\s*\+\s*([0-9k,.m]+)/i);
  if (tcBbMatch) {
    const rate1 = parseRate(tcBbMatch[1].trim(), 'tc');
    const lump1 = parseRate(tcBbMatch[2].trim(), 'bb');

    // Check if there's a "vs" with another TC+BB pair
    const vsMatch = line.match(/vs\s+([0-9k,.]+)\s*\+\s*([0-9k,.m]+)/i);
    if (vsMatch) {
      bid_usd = rate1;
      bid_bb_usd = lump1;
      offer_usd = parseRate(vsMatch[1].trim(), 'tc');
      bb_usd = parseRate(vsMatch[2].trim(), 'bb');
    } else if (is_bid) {
      bid_usd = rate1;
      bid_bb_usd = lump1;
    } else {
      offer_usd = rate1;
      bb_usd = lump1;
    }
  }

  // Delivery basis from offer line: "bss APS Santos", "bss 15th April"
  const bssMatch = line.match(/\bbss\s+(APS\s+\w+|\w+)/i);
  if (bssMatch) {
    const bssVal = bssMatch[1].trim();
    // Check if it's a date reference
    if (!/\d/.test(bssVal)) {
      delivery_basis = bssVal.toUpperCase();
    }
  }

  // Date from offer: "from 21st", "bss 15th April", "bss 21 April onw"
  const fromMatch = line.match(/(?:from|bss)\s+(\d{1,2})(?:st|nd|rd|th)?\s*([a-z]*)/i);
  if (fromMatch && fromMatch[2]) {
    offer_date = parseDate(`${fromMatch[1]} ${fromMatch[2]}`);
  }

  // Standard "claims seeing X vs Y" or just "X vs Y"
  if (!tcBbMatch) {
    const claimsMatch = line.match(/claims\s+seeing\s+([0-9k,.\s]+?)(?:\s+multiple\s+times)?\s+vs\s+([0-9k,.\s]+)/i);
    if (claimsMatch) {
      bid_usd = parseRate(claimsMatch[1].trim(), 'tc');
      offer_usd = parseRate(claimsMatch[2].trim(), 'tc');
    } else {
      const vsMatch2 = line.match(/(?:was\s+)?([0-9k,.]+)\s+vs\s+([0-9k,.]+)/i);
      if (vsMatch2) {
        bid_usd = parseRate(vsMatch2[1].trim(), 'tc');
        offer_usd = parseRate(vsMatch2[2].trim(), 'tc');
      }
    }
  }

  // "Ideas 21,500", "Rating 21500", "thinking 18 in front" — single offer
  if (!offer_usd && !bid_usd) {
    const ideasMatch = line.match(/\b(?:ideas?|thinking|loosely\s+thinking|rating)\s+([0-9k,.]+)/i);
    if (ideasMatch) {
      is_idea = true;
      offer_usd = parseRate(ideasMatch[1].trim(), 'tc');
    }
  }

  // Route from "ECSA OPT NCSA/FEAST" or similar trailing route preferences
  if (!route) {
    const routeTrail = line.match(/\b(ECSA|USG|NCSA)\b.*?\b(OPT|FH|TA|FEAST)\b/i);
    if (routeTrail) {
      const rt = routeTrail[0].toUpperCase();
      if (rt.includes('ECSA')) route = rt.includes('TA') ? 'ECSA TA' : 'ECSA FH';
      else if (rt.includes('USG')) route = rt.includes('TA') ? 'USG TA' : 'USG FH';
      else if (rt.includes('NCSA')) route = 'NCSA FH';
    }
  }

  // "Offers 19750+975" already handled above
  // "Offers X" single rate
  if (!offer_usd && !tcBbMatch) {
    const offersMatch = line.match(/\boffers?\s+([0-9k,.]+)/i);
    if (offersMatch) {
      offer_usd = parseRate(offersMatch[1].trim(), 'tc');
    }
  }

  // "@ 19k" for bid lines
  if (is_bid && !bid_usd && !tcBbMatch) {
    const atMatch = line.match(/@\s*([0-9k,.]+)/i);
    if (atMatch) {
      bid_usd = parseRate(atMatch[1].trim(), 'tc');
    }
  }

  // "Collecting" or "rvtng ideas" = early stage, no rates (handle truncated "collec")
  const collecting = /\b(collect(ing)?|rvtng|reverting)\b/i.test(line);

  return {
    route,
    bid_usd,
    offer_usd,
    bb_usd,
    bid_bb_usd,
    bid_multiple_claims,
    p6_bid,
    p6_offer,
    delivery_basis,
    offer_date,
    is_bid,
    is_idea,
    collecting,
    notes
  };
}

// ─── Status Detection ────────────────────────────────────────────────────────

function detectStatus(lines) {
  const text = lines.join(' ').toUpperCase();
  if (/\bON\s+SUBS\b/i.test(text)) return 'ON SUBS';
  if (/\bOFF[\s-]?MKT\b|\bOFF[\s-]?MARKET\b/i.test(text)) return 'WITHDRAWN';
  if (/\bFIXED\b/i.test(text)) return 'FIXED';
  if (/\bFAILED\b/i.test(text)) return 'FAILED';
  if (/\bEX[\s-]?OUR[\s-]?CP\b/i.test(text)) return 'WITHDRAWN';
  return 'OPEN';
}

// ─── Pre-processor: normalize single-line messages into multi-line ───────────

function preprocessMessage(rawText) {
  // Split on "---", "----", "-----" etc. (3+ dashes) to create separate lines
  let text = rawText.replace(/-{3,}/g, '\n');

  // Extract inline (BOD ...) from vessel line and put on its own line
  // Matches: (BOD BSS SANTOS: ABT 700/140) or (BOD: 784/112) etc.
  text = text.replace(/\(BOD\b([^)]*)\)/gi, (match, inner) => {
    return '\nBOD' + inner;
  });

  return text;
}

// ─── Main Message Parser ─────────────────────────────────────────────────────

function parseTonnageMessage(rawText) {
  const processed = preprocessMessage(rawText);
  const lines = processed.split('\n').map(l => l.trim()).filter(Boolean);

  const vessel = {
    source: null, owner: null, vessel_name: null, dwt: null, build_year: null,
    scrubber: null, current_position: null, open_date: null, open_date_end: null,
    eta_ecsa: null, eta_ecsa_end: null, eta_type: null, delivery_basis: null,
    bod_ifo: null, bod_mdo: null, bod_basis: null, bod_fuel_type: null,
    market_colour: [],
    tc_offer: null, bb_offer: null,
    status: 'OPEN',
    fixed_route: null, fixed_rate_p6: null, fixed_at: null,
    notes: null,
    raw: rawText,
    parsed_at: new Date().toISOString(),
    parse_warnings: []
  };

  // Detect overall status from the full message
  vessel.status = detectStatus(lines);

  // Check if this is a cargo-side bid (different structure)
  const isCargoBid = /\bbid(ding)?\s+(here|on)\b/i.test(rawText);

  // For cargo bids: first line is cargo description, not a vessel line.
  // Parse vessel info from the bid line instead.
  if (isCargoBid) {
    // Parse first line as cargo context (source + route + laycan)
    const firstLine = lines[0] || '';
    const dashIdx = firstLine.indexOf(' - ');
    if (dashIdx !== -1) {
      vessel.source = firstLine.slice(0, dashIdx).trim();
    }
    // Extract route from first line
    const routePatterns = ['ECSA FH', 'ECSA TA', 'USG FH', 'USG TA', 'NCSA FH'];
    for (const rp of routePatterns) {
      if (firstLine.toUpperCase().includes(rp)) {
        vessel.notes = `Cargo bid: ${firstLine}`;
        break;
      }
    }
    if (!vessel.notes) vessel.notes = `Cargo bid: ${firstLine}`;

    // Extract ETA/laycan from first line if present
    const etaFromCargo = firstLine.match(/(\d{1,2}\s+(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*)\s*(onw)?/i);
    if (etaFromCargo) {
      vessel.eta_ecsa = parseDate(etaFromCargo[1]);
      vessel.eta_type = etaFromCargo[2] ? 'ONW' : 'EXACT';
    }

    // Now parse remaining lines for bid info + vessel details
    for (let i = 1; i < lines.length; i++) {
      const line = lines[i];
      if (/\bbid(ding)?\b/i.test(line)) {
        // Extract vessel name + specs from bid line: "MV Navios Victory (77/14)"
        const mvMatch = line.match(/M[VT]\s+(.+?)\s*\((\d+)\/(\d{2,4})\)/i);
        if (mvMatch) {
          vessel.vessel_name = mvMatch[1].trim();
          const dwtRaw = parseInt(mvMatch[2], 10);
          vessel.dwt = dwtRaw < 1000 ? dwtRaw * 1000 : dwtRaw;
          const yearRaw = parseInt(mvMatch[3], 10);
          vessel.build_year = yearRaw < 100 ? 2000 + yearRaw : yearRaw;
        }
        const mc = parseMarketColourLine(line);
        mc.is_bid = true;
        if (!mc.route) {
          for (const rp of routePatterns) {
            if (firstLine.toUpperCase().includes(rp)) { mc.route = rp; break; }
          }
        }
        vessel.market_colour.push(mc);
      }
    }
  } else {
    // Standard vessel message parsing
    for (let line of lines) {
      // Strip wrapping parentheses: "(BOD BSS SANTOS: ABT 700/140)" → "BOD BSS SANTOS: ABT 700/140"
      const stripped = line.replace(/^\((.+)\)$/, '$1').trim();

      // BOD line
      if (/^BOD\b/i.test(stripped) || /\bBOD\b.*\d+.*\/.*\d+/i.test(stripped)) {
        const bod = parseBODLine(stripped);
        Object.assign(vessel, bod);
        continue;
      }

      // Skip section headers like "//remain//", "//new//"
      if (/^\/\/\w+\/\/$/.test(line)) continue;

      // Rate lines starting with "-$" (e.g. "-$20k fr ecsa fh")
      if (/^\s*-\$\d/i.test(line)) {
        const rateMatch = line.match(/\$([0-9k,.]+)/i);
        if (rateMatch) {
          const route = /ecsa\s*fh|fh/i.test(line) ? 'ECSA FH' : /safr|sa\b/i.test(line) ? 'SAFR' : /ecsa/i.test(line) ? 'ECSA FH' : null;
          const rate = parseRate(rateMatch[1], 'tc');
          if (rate) {
            vessel.market_colour.push({ route, bid_usd: null, offer_usd: rate, bb_usd: null, bid_bb_usd: null, bid_multiple_claims: false, p6_bid: null, p6_offer: null, delivery_basis: null, offer_date: null, is_bid: false, is_idea: true, collecting: false, notes: line.trim() });
          }
        }
        continue;
      }

      // Standalone ETA line: "ETA RBAY 10APR / ETA SANTOS 26APR" or "ETA SANTOS 26APR"
      if (/^ETA\b/i.test(line) && !vessel.eta_ecsa) {
        // Try to find the last ETA date (rightmost = final destination ETA)
        const etaMatches = [...line.matchAll(/ETA\s+(?:\w+\s+)?(\d{1,2}\s*(?:jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*)/gi)];
        if (etaMatches.length > 0) {
          const lastEta = etaMatches[etaMatches.length - 1];
          vessel.eta_ecsa = parseDate(lastEta[1]);
          vessel.eta_type = /\bonw\b/i.test(line) ? 'ONW' : 'EXACT';
        }
        // Also try compressed format: "10APR"
        if (!vessel.eta_ecsa) {
          const compressed = [...line.matchAll(/(\d{1,2})(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)/gi)];
          if (compressed.length > 0) {
            const last = compressed[compressed.length - 1];
            vessel.eta_ecsa = parseDate(last[1] + ' ' + last[2]);
            vessel.eta_type = /\bonw\b/i.test(line) ? 'ONW' : 'EXACT';
          }
        }
        continue;
      }

      // "SLD DAHEJ 27MAR" = sailed from port on date
      if (/^SLD\b/i.test(line)) {
        const sldMatch = line.match(/^SLD\s+(\w+)\s+(\d{1,2})\s*([a-z]+)/i);
        if (sldMatch) {
          vessel.current_position = sldMatch[1].toUpperCase();
          vessel.open_date = parseDate(sldMatch[2] + ' ' + sldMatch[3]);
        }
        continue;
      }

      // Market colour / rate lines
      if (/^=/.test(line) || /claims\s+seeing/i.test(line) || /\b(loosely\s+)?thinking\b/i.test(line)
          || /^\s*ideas?\b/i.test(line) || /^\s*offers?\s+\d/i.test(line) || /^\s*on\s+subs\b/i.test(line)
          || /^\s*last\s+offered\b/i.test(line) || /^\s*pref\b/i.test(line) || /^\s*collecting\b/i.test(line)
          || /^\s*rating\b/i.test(line)) {
        const mc = parseMarketColourLine(line);
        if (mc.route || mc.bid_usd || mc.offer_usd || mc.p6_bid || mc.p6_offer || mc.collecting) {
          vessel.market_colour.push(mc);
          if (mc.bb_usd && !vessel.bb_offer) vessel.bb_offer = mc.bb_usd;
        }
        continue;
      }

      // Status lines: "OFF-MKT & EX-OUR CP", "FIXED KOCH..."
      if (/\bOFF[\s-]?MKT\b|\bEX[\s-]?OUR[\s-]?CP\b|\bFIXED\b|\bFAILED\b|\bWITHDRAWN\b/i.test(line) && vessel.vessel_name) {
        const statusNotes = line.replace(/\bOFF[\s-]?MKT\b|\bEX[\s-]?OUR[\s-]?CP\b/gi, '').replace(/[&]/g, '').trim();
        if (statusNotes) {
          vessel.notes = vessel.notes ? vessel.notes + '; ' + statusNotes : statusNotes;
        }
        continue;
      }

      // Line starting with "MV" — vessel line (possibly with owner already set from previous line)
      if (/^M[VT]\s/i.test(line) && !vessel.vessel_name) {
        if (vessel.source && !vessel.owner) vessel.owner = vessel.source;
        // Try to extract DWT in comma format: "82,311/2014"
        const commaSpec = line.match(/(\d{1,3}(?:,\d{3})+)\/(\d{4})/);
        if (commaSpec) {
          vessel.dwt = parseInt(commaSpec[1].replace(/,/g, ''), 10);
          vessel.build_year = parseInt(commaSpec[2], 10);
          line = line.replace(commaSpec[0], '').trim();
        }
        // Check for scrubber
        if (/\bscrubber\b/i.test(line)) vessel.scrubber = true;
        // Extract vessel name (after MV, before specs)
        const nameMatch = line.match(/^M[VT]\s+(.+?)(?:\s+\d|\s*\(|\s*$)/i);
        if (nameMatch) vessel.vessel_name = nameMatch[1].trim();
        else {
          const simpleName = line.replace(/^M[VT]\s+/i, '').replace(/\(.*\)/, '').trim();
          vessel.vessel_name = simpleName || null;
        }
        // Check for SLD (sailed) inline
        const sldInline = line.match(/\bSLD\s+(\w+)\s+(\d{1,2})\s*([a-z]+)/i);
        if (sldInline) {
          vessel.current_position = sldInline[1].toUpperCase();
          vessel.open_date = parseDate(sldInline[2] + ' ' + sldInline[3]);
        }
        continue;
      }

      // First unmatched line = vessel line (or owner if no MV)
      if (!vessel.vessel_name && !vessel.source) {
        // Look ahead: if this line has no MV/specs and the NEXT line starts with MV,
        // treat this as an owner name, not a vessel line
        const nextLines = lines.slice(lines.indexOf(line) + 1);
        const nextHasMV = nextLines.some(l => /^M[VT]\s/i.test(l));
        const thisHasMV = /\bM[VT]\s/i.test(line);
        const thisHasSpecs = /\(\d+[,']?\d*\/\d{2,4}\)/.test(line) || /\d{2,3}[,']\d{3}\/\d{4}/.test(line);

        if (!thisHasMV && !thisHasSpecs && nextHasMV) {
          // This is just an owner/source name
          vessel.source = line.trim();
          vessel.owner = line.trim();
        } else {
          Object.assign(vessel, parseVesselLine(line));
        }
        continue;
      }

      // Owner-only line (short, all caps, no MV) — if we don't have owner yet
      if (!vessel.owner && line.trim().split(/\s+/).length <= 3 && /^[A-Z\s]+$/.test(line.trim())) {
        vessel.owner = line.trim();
        continue;
      }

      vessel.parse_warnings.push(`Unmatched line: "${line}"`);
    }
  }

  // Collect delivery basis from market colour if vessel level is empty
  if (!vessel.delivery_basis) {
    for (const mc of vessel.market_colour) {
      if (mc.delivery_basis) {
        vessel.delivery_basis = mc.delivery_basis;
        break;
      }
    }
  }

  // Validation warnings
  if (!vessel.vessel_name) vessel.parse_warnings.push('Could not extract vessel name');
  if (!vessel.eta_ecsa) vessel.parse_warnings.push('No ETA extracted');
  if (vessel.market_colour.length === 0) vessel.parse_warnings.push('No market colour parsed');

  return vessel;
}

function parseMultipleMessages(rawBlock) {
  // Split on blank lines, but rejoin chunks that are continuations
  const rawChunks = rawBlock.split(/\n{2,}/).map(m => m.trim()).filter(Boolean);
  const messages = [];
  for (const chunk of rawChunks) {
    const firstLine = chunk.split('\n')[0].trim();

    // Skip section headers like "//remain//", "//new//", "//update//"
    if (/^\/\/\w+\/\/$/.test(firstLine) && chunk.split('\n').length === 1) {
      // Standalone header — treat rate lines after it as context for next message
      continue;
    }

    // If this chunk starts with a continuation pattern, append to previous
    if (messages.length > 0 && /^[=(]|^BOD\b|^on\s+subs\b|^off[\s-]?mkt\b|^fixed\b|^failed\b|^-\$/i.test(firstLine)) {
      messages[messages.length - 1] += '\n' + chunk;
    }
    // If this chunk starts with MV/MT (vessel line) and previous has no vessel yet, join
    else if (messages.length > 0 && /^M[VT]\s/i.test(firstLine)) {
      messages[messages.length - 1] += '\n' + chunk;
    }
    // If this chunk starts with ETA and previous exists, join
    else if (messages.length > 0 && /^ETA\b/i.test(firstLine)) {
      messages[messages.length - 1] += '\n' + chunk;
    }
    else {
      messages.push(chunk);
    }
  }

  // Filter out messages that are just section headers with rate context
  return messages
    .filter(m => {
      const lines = m.split('\n').map(l => l.trim()).filter(Boolean);
      // Must have at least one line with MV or vessel-like content
      return lines.some(l => /\bM[VT]\s/i.test(l) || /\(\d+[,']\d*\/?\d+\)/.test(l) || /\d+[,']?\d*\/\d{2,4}/.test(l));
    })
    .map(parseTonnageMessage);
}

// Export for both Node.js and browser
if (typeof module !== 'undefined' && module.exports) {
  module.exports = {
    parseRate, parseDate, parseDateRange, detectScrubber, getLaycanPeriod,
    laycanSortKey, parseVesselLine, parseBODLine, parseMarketColourLine,
    parseTonnageMessage, parseMultipleMessages
  };
}

// ─── App State ────────────────────────────────────────────────────────────────
let vessels = []; // loaded async from API on init
let pendingParsed = null;
let activeFilters = new Set(['ALL']); // multi-select status filters
let currentSort = { key: 'eta_ecsa', dir: 'asc' };

// Column visibility AND order — stored in localStorage
const ALL_COLUMNS = ['laycan','vessel','owner','specs','scr','delivery','eta','p6_bid','p6_offer','spread','fixed','charterer','date_fixed','last_updated','notes','status','actions'];
const DEFAULT_ORDER = ['laycan','vessel','owner','specs','delivery','eta','p6_bid','p6_offer','spread','fixed','charterer','date_fixed','last_updated','notes','status','actions'];
let columnOrder = JSON.parse(localStorage.getItem('pt_col_order') || 'null') || [...DEFAULT_ORDER];
let hiddenColumns = new Set(JSON.parse(localStorage.getItem('pt_col_hidden') || '[]'));

// Migrate old format
const oldVisible = JSON.parse(localStorage.getItem('pt_columns') || 'null');
if (oldVisible && !localStorage.getItem('pt_col_order')) {
  columnOrder = oldVisible;
  hiddenColumns = new Set(ALL_COLUMNS.filter(c => !oldVisible.includes(c)));
  // Add any columns missing from old order
  ALL_COLUMNS.forEach(c => { if (!columnOrder.includes(c)) columnOrder.push(c); });
  saveColumns();
}

let _saveTimer = null;
function save() {
  // Keep localStorage in sync as a fast local cache / offline fallback
  localStorage.setItem('pt_vessels', JSON.stringify(vessels));
  // Debounce API writes so rapid inline edits don't hammer the server
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    fetch('/api/vessels', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(vessels),
    }).catch(() => {}); // silent — localStorage is the fallback
  }, 500);
}
function touchVessel(idx) { vessels[idx].last_updated = new Date().toISOString(); }
function saveColumns() {
  localStorage.setItem('pt_col_order', JSON.stringify(columnOrder));
  localStorage.setItem('pt_col_hidden', JSON.stringify([...hiddenColumns]));
}
function colVis(col) { return !hiddenColumns.has(col); }

// ─── Formatting ──────────────────────────────────────────────────────────────

function fmtDate(iso) {
  if (!iso) return '';
  const [, m, d] = iso.split('-');
  const months = ['','JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)]}`;
}

function fmtNum(n) {
  if (n == null) return '';
  return n.toLocaleString();
}

function fmtTimestamp(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const day = d.getDate();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const h = d.getHours().toString().padStart(2,'0');
  const m = d.getMinutes().toString().padStart(2,'0');
  return `${day} ${months[d.getMonth()]} ${h}:${m}`;
}

function getP6Values(v) {
  const mc = v.market_colour && v.market_colour[0];
  return { bid: mc ? mc.p6_bid : null, offer: mc ? mc.p6_offer : null };
}

function getSpread(v) {
  const p6 = getP6Values(v);
  if (p6.offer != null && p6.bid != null) return p6.offer - p6.bid;
  return null;
}

// ─── Inline Editing ──────────────────────────────────────────────────────────

function startEdit(el, vesselIdx, field, isMono) {
  if (el.querySelector('input')) return; // already editing
  const current = el.textContent.trim();
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current === '—' || current === '' ? '' : current;
  input.className = 'edit-input' + (isMono ? ' mono' : '');
  input.style.width = Math.max(el.offsetWidth - 8, 50) + 'px';

  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const val = input.value.trim();
    applyEdit(vesselIdx, field, val);
    renderTable();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { renderTable(); }
  });
}

function applyEdit(idx, field, val) {
  const v = vessels[idx];
  if (!v) return;
  // Timestamp on bid/offer/fixed price changes
  if (['p6_bid','p6_offer','fixed_price'].includes(field)) touchVessel(idx);

  switch (field) {
    case 'vessel_name': v.vessel_name = val || null; break;
    case 'owner': v.owner = val || null; break;
    case 'source': v.source = val || null; break;
    case 'dwt': {
      const n = parseFloat(val.replace(/[kK]/g, '').replace(/,/g, ''));
      if (!isNaN(n)) v.dwt = n < 1000 ? n * 1000 : n;
      break;
    }
    case 'build_year': {
      const y = parseInt(val, 10);
      if (!isNaN(y)) v.build_year = y < 100 ? 2000 + y : y;
      break;
    }
    case 'scrubber':
      v.scrubber = val.toLowerCase() === 'yes' || val.toLowerCase() === 'scr' || val === '1' ? true : (val === '' ? null : false);
      break;
    case 'delivery_basis': v.delivery_basis = val ? val.toUpperCase() : null; break;
    case 'eta_ecsa': {
      // Accept "21 APR", "2026-04-21", etc.
      if (val.includes('-')) { v.eta_ecsa = val; }
      else { const d = parseDate(val); if (d) v.eta_ecsa = d; }
      break;
    }
    case 'p6_bid': {
      const n = parseRate(val, 'tc');
      if (v.market_colour && v.market_colour[0]) v.market_colour[0].p6_bid = n;
      else v.market_colour = [{ route: 'ECSA FH', p6_bid: n, p6_offer: null, bid_usd: null, offer_usd: null }];
      break;
    }
    case 'p6_offer': {
      const n = parseRate(val, 'tc');
      if (v.market_colour && v.market_colour[0]) v.market_colour[0].p6_offer = n;
      else v.market_colour = [{ route: 'ECSA FH', p6_bid: null, p6_offer: n, bid_usd: null, offer_usd: null }];
      break;
    }
    case 'fixed_price': {
      const n = parseRate(val, 'tc');
      v.fixed_price = n;
      break;
    }
    case 'charterer': v.charterer = val || null; break;
    case 'date_fixed': {
      if (val.includes('-')) v.date_fixed = val;
      else { const d = parseDate(val); if (d) v.date_fixed = d; }
      break;
    }
    case 'notes': v.notes = val || null; break;
    case 'dwt': {
      const n = parseFloat(val.replace(/[kK]/g, '').replace(/,/g, ''));
      if (!isNaN(n)) v.dwt = n < 1000 ? n * 1000 : n;
      break;
    }
    case 'build_year': {
      const y = parseInt(val, 10);
      if (!isNaN(y)) v.build_year = y < 100 ? 2000 + y : y;
      break;
    }
  }
  save();
}

// ─── Mode Toggle ─────────────────────────────────────────────────────────────

function setMode(mode) {
  const isManual = mode === 'manual';
  document.getElementById('parsePanel').style.display = isManual ? 'none' : 'flex';
  document.getElementById('manualPanel').style.display = isManual ? 'flex' : 'none';
  document.getElementById('modeParseBtn').classList.toggle('active', !isManual);
  document.getElementById('modeManualBtn').classList.toggle('active', isManual);
  document.getElementById('panelTitleText').textContent = isManual ? 'Manual Entry' : 'WhatsApp Inbox';
}

// ─── Manual Entry ─────────────────────────────────────────────────────────────

function handleManualAdd() {
  const g = id => document.getElementById(id).value.trim();

  const dwtRaw = parseFloat(g('mf_dwt'));
  const dwt = isNaN(dwtRaw) ? null : (dwtRaw < 1000 ? dwtRaw * 1000 : dwtRaw);

  const p6Bid = g('mf_p6_bid') ? parseFloat(g('mf_p6_bid')) : null;
  const p6Offer = g('mf_p6_offer') ? parseFloat(g('mf_p6_offer')) : null;
  const scrubberVal = g('mf_scrubber');

  const vessel = {
    vessel_name: g('mf_vessel_name') || null,
    owner: g('mf_owner') || null,
    source: g('mf_owner') || null,
    dwt,
    build_year: g('mf_build_year') ? parseInt(g('mf_build_year'), 10) : null,
    scrubber: scrubberVal === 'yes' ? true : scrubberVal === 'no' ? false : null,
    current_position: g('mf_current_position') || null,
    delivery_basis: g('mf_delivery_basis') || null,
    open_date: g('mf_open_date') || null,
    eta_ecsa: g('mf_eta_ecsa') || null,
    eta_ecsa_end: null,
    eta_type: g('mf_eta_type') || 'EXACT',
    market_colour: (p6Bid || p6Offer) ? [{
      route: g('mf_route') || 'ECSA FH',
      p6_bid: p6Bid,
      p6_offer: p6Offer,
      bid_usd: null,
      offer_usd: null,
    }] : [],
    status: g('mf_status') || 'OPEN',
    notes: g('mf_notes') || null,
    raw: null,
    parsed_at: new Date().toISOString(),
    last_updated: new Date().toISOString(),
    parse_warnings: [],
  };

  if (!vessel.vessel_name) {
    alert('Vessel name is required.');
    return;
  }

  const existIdx = vessels.findIndex(v =>
    v.vessel_name && vessel.vessel_name &&
    v.vessel_name.toUpperCase() === vessel.vessel_name.toUpperCase()
  );
  if (existIdx !== -1) {
    vessels[existIdx] = { ...vessels[existIdx], ...vessel };
  } else {
    vessels.push(vessel);
  }

  save(); renderTable(); updateStats();
  handleManualClear();
  setMode('parse');
}

// ─── Claude API Parser ──────────────────────────────────────────────────────

const PARSE_SYSTEM_PROMPT = `You are a dry bulk shipping message parser. Extract vessel tonnage data from WhatsApp messages into structured JSON.

FIELD DEFINITIONS:
- source: The broker who sent the message (before " - " or after "WITH"). This is NOT the owner.
- owner: The vessel owner/operator. The name before " - " is usually the OWNER, not a broker. "CENTROFIN - MV NIRIIS" means CENTROFIN is the owner. "WITH QUADRA MV..." means QUADRA is the broker. If the source appears to be an owner (marketing their own vessel), put the same name in both source and owner.
- vessel_name: Ship name (after MV/MT, without the MV/MT prefix)
- dwt: Deadweight tonnage (number, e.g. 81688). (81/17) means 81,000 DWT built 2017. (81'688DWT) means 81,688 DWT.
- build_year: Year built (4-digit)
- draft: Maximum draft in meters if provided
- scrubber: true if SCR/scrubber/+S mentioned, null if unknown
- current_position: Current port/location
- open_date: Date vessel is open (ISO format YYYY-MM-DD). If range like "10-15 APR", use earliest date.
- eta_ecsa: ETA to ECSA/loading area (ISO format). If range, use earliest.
- eta_ecsa_end: End of ETA range if given (ISO format), null if single date.
- eta_type: "ONW" if onwards/approximate, "EXACT" if firm date
- delivery_basis: Delivery terms (APS ECSA, SANTOS, PARANAGUA, DLOSP, etc.)
- bod_ifo: Bunkers on delivery - IFO/LSFO/HFO quantity in MT
- bod_mdo: Bunkers on delivery - MDO/LSMGO quantity in MT
- bod_basis: BOD basis port (e.g. SANTOS, ENNORE)
- bod_fuel_type: "LSFO/LSMGO" if low-sulphur, null for standard IFO/MDO
- market_colour: Array of rate/offer objects, each with:
  - route: "ECSA FH", "ECSA TA", "USG FH", etc. FEAST = Far East = FH (fronthaul)
  - bid_usd: Bid/market side rate ($/day)
  - offer_usd: Owner's asking rate ($/day). "Rating", "Ideas", "Offers" all mean the offer.
  - bb_usd: Ballast bonus lump sum ($). "19k + 900k" means 19,000/day TC + $900,000 BB.
  - p6_bid: P6 equivalent of bid
  - p6_offer: P6 equivalent of offer. Parse from (p6: X) or (p6 bss X = Y) where Y is the p6 equiv.
- status: "OPEN", "ON SUBS", "FIXED", "FAILED", "WITHDRAWN". "OFF-MKT" or "EX-OUR CP" = WITHDRAWN. "On subs (nfd)" = ON SUBS.
- notes: The raw offer/rate line verbatim (e.g. "Ideas 21k try less (p6: 17,750 vs 19,200)") plus any extra context (CP notes, cargo details, route preferences). Always include the original rate/offer text here.

IMPORTANT:
- Use current year (${new Date().getFullYear()}) for dates without a year
- Return an array of vessel objects, one per vessel in the input
- Multiple messages may be separated by blank lines
- "RATING 21500" means offer of $21,500/day
- "Ideas 18k" means offer of $18,000/day
- "try 18k infront" means the bid side is $18,000/day
- "ECSA OPT NCSA/FEAST" means route options are ECSA FH or NCSA FH
- If a line contains "(CP ON THIS VSL)" note it but still parse the vessel

Return ONLY valid JSON array. No markdown, no explanation.`;

async function parseWithAPI(rawText) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('No API key set. Enter your Anthropic API key below.');

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-haiku-4-5',
      max_tokens: 4096,
      system: PARSE_SYSTEM_PROMPT,
      messages: [{
        role: 'user',
        content: `Parse these vessel tonnage messages into JSON:\n\n${rawText}`
      }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(`API error ${response.status}: ${err.error?.message || response.statusText}`);
  }

  const data = await response.json();
  const text = data.content.find(b => b.type === 'text')?.text;
  if (!text) throw new Error('No response from API');

  const parsed = JSON.parse(text);
  const vessels = Array.isArray(parsed) ? parsed : [parsed];

  // Add metadata
  return vessels.map(v => ({
    ...v,
    raw: rawText,
    parsed_at: new Date().toISOString(),
    parse_warnings: [],
    status: v.status || 'OPEN',
    market_colour: v.market_colour || []
  }));
}

function startEditSpecs(el, vesselIdx) {
  if (el.querySelector('input')) return;
  const v = vessels[vesselIdx];
  const dwtVal = v.dwt ? (v.dwt/1000).toFixed(0) : '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = `${dwtVal}/${v.build_year || ''}`;
  input.className = 'edit-input mono';
  input.placeholder = '82/19';
  input.style.width = Math.max(el.offsetWidth - 8, 60) + 'px';
  el.textContent = '';
  el.appendChild(input);
  input.focus();
  input.select();

  function commit() {
    const val = input.value.trim();
    const match = val.match(/(\d+)\s*\/\s*(\d+)/);
    if (match) {
      applyEdit(vesselIdx, 'dwt', match[1]);
      applyEdit(vesselIdx, 'build_year', match[2]);
    }
    renderTable();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') renderTable();
  });
}

async function handleParse() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) return;
  const preview = document.getElementById('previewBox');
  const btnAdd = document.getElementById('btnAdd');
  const btnParse = document.getElementById('btnParse');

  const apiKey = getApiKey();
  if (!apiKey) {
    // Fall back to regex if no API key
    handleParseRegex();
    return;
  }

  btnParse.disabled = true;
  btnParse.textContent = 'Parsing...';
  preview.textContent = 'Sending to Claude API...';
  preview.className = 'preview-box';

  try {
    const parsed = await parseWithAPI(raw);
    pendingParsed = parsed;
    const summary = parsed.map(v =>
      `${v.vessel_name || '?'} (${v.dwt ? (v.dwt/1000).toFixed(0)+'K' : '?'}/${v.build_year || '?'}) ETA: ${fmtDate(v.eta_ecsa)} ${v.eta_type === 'ONW' ? 'ONW' : ''} [${v.status}]`
    ).join('\n');
    preview.textContent = `AI parsed ${parsed.length} vessel(s):\n${summary}`;
    preview.className = 'preview-box has-content';
    btnAdd.disabled = false;
  } catch (e) {
    preview.textContent = 'AI parse error: ' + e.message + '\n\nTrying regex fallback...';
    preview.className = 'preview-box has-error';
    // Auto-fallback to regex
    try {
      const parsed = parseMultipleMessages(raw);
      pendingParsed = parsed;
      const summary = parsed.map(v =>
        `${v.vessel_name || '?'} (${v.dwt ? (v.dwt/1000).toFixed(0)+'K' : '?'}/${v.build_year || '?'}) ETA: ${fmtDate(v.eta_ecsa)} ${v.eta_type === 'ONW' ? 'ONW' : ''} [${v.status}]`
      ).join('\n');
      preview.textContent = `Regex fallback parsed ${parsed.length} vessel(s):\n${summary}`;
      preview.className = 'preview-box has-content';
      btnAdd.disabled = false;
    } catch (e2) {
      preview.textContent = 'Both AI and regex parsing failed:\n' + e.message + '\n' + e2.message;
      preview.className = 'preview-box has-error';
      btnAdd.disabled = true;
    }
  } finally {
    btnParse.disabled = false;
    btnParse.textContent = 'Parse (AI)';
  }
}

function handleParseRegex() {
  const raw = document.getElementById('rawInput').value.trim();
  if (!raw) return;
  const preview = document.getElementById('previewBox');
  const btnAdd = document.getElementById('btnAdd');
  try {
    const parsed = parseMultipleMessages(raw);
    pendingParsed = parsed;
    const summary = parsed.map(v =>
      `${v.vessel_name || '?'} (${v.dwt ? (v.dwt/1000).toFixed(0)+'K' : '?'}/${v.build_year || '?'}) ETA: ${fmtDate(v.eta_ecsa)} ${v.eta_type === 'ONW' ? 'ONW' : ''} [${v.status}]`
    ).join('\n');
    preview.textContent = `Regex parsed ${parsed.length} vessel(s):\n${summary}`;
    preview.className = 'preview-box has-content';
    btnAdd.disabled = false;
  } catch (e) {
    preview.textContent = 'Regex parse error: ' + e.message;
    preview.className = 'preview-box has-error';
    btnAdd.disabled = true;
  }
}

function handleAdd() {
  if (!pendingParsed) return;
  for (const pv of pendingParsed) {
    const existIdx = vessels.findIndex(v =>
      v.vessel_name && pv.vessel_name &&
      v.vessel_name.toUpperCase() === pv.vessel_name.toUpperCase()
    );
    if (existIdx !== -1) {
      const existing = vessels[existIdx];
      vessels[existIdx] = { ...existing, ...pv, owner: pv.owner || existing.owner, notes: pv.notes || existing.notes, status: pv.status !== 'OPEN' ? pv.status : existing.status };
    } else {
      vessels.push(pv);
    }
  }
  save(); renderTable(); updateStats();
  document.getElementById('rawInput').value = '';
  document.getElementById('previewBox').textContent = `Added ${pendingParsed.length} vessel(s).`;
  document.getElementById('previewBox').className = 'preview-box has-content';
  document.getElementById('btnAdd').disabled = true;
  pendingParsed = null;
}

function handleClear() {
  document.getElementById('rawInput').value = '';
  document.getElementById('previewBox').textContent = 'Parsed output will appear here';
  document.getElementById('previewBox').className = 'preview-box';
  document.getElementById('btnAdd').disabled = true;
  pendingParsed = null;
}

function loadSample() {
  try {
    // Using embedded data
    const data = SAMPLE_DATA;

    save(); renderTable(); updateStats();
    document.getElementById('previewBox').textContent = `Loaded ${data.length} sample vessels.`;

// ─── Sorting ─────────────────────────────────────────────────────────────────

function sortBy(key) {
  if (currentSort.key === key) {
    currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    currentSort.key = key;
    currentSort.dir = key === 'p6_offer' || key === 'p6_bid' || key === 'spread' || key === 'dwt' ? 'desc' : 'asc';
  }
  renderTable();
}

function getSortValue(v, key) {
  switch (key) {
    case 'laycan': return v.eta_ecsa || '9999-99-99';
    case 'eta_ecsa': return v.eta_ecsa || '9999-99-99';
    case 'p6_bid': return getP6Values(v).bid || 0;
    case 'p6_offer': return getP6Values(v).offer || 0;
    case 'spread': return getSpread(v) || 0;
    case 'fixed_price': return v.fixed_price || 0;
    case 'date_fixed': return v.date_fixed || '9999-99-99';
    case 'last_updated': return v.last_updated || '';
    case 'dwt': return v.dwt || 0;
    case 'vessel_name': return (v.vessel_name || '').toUpperCase();
    case 'owner': return (v.owner || '').toUpperCase();
    case 'source': return (v.source || '').toUpperCase();
    case 'delivery_basis': return (v.delivery_basis || '').toUpperCase();
    case 'status': return v.status || '';
    default: return '';
  }
}

// ─── Status & Actions ────────────────────────────────────────────────────────

function cycleStatus(idx) {
  const states = ['OPEN', 'ON SUBS', 'FIXED', 'FAILED', 'WITHDRAWN'];
  const cur = vessels[idx].status || 'OPEN';
  const next = states[(states.indexOf(cur) + 1) % states.length];
  vessels[idx].status = next;
  touchVessel(idx);

  // Prompt for fixed price, charterer, and auto-set date when moving to ON SUBS
  if (next === 'ON SUBS' && !vessels[idx].fixed_price) {
    if (!vessels[idx].date_fixed) vessels[idx].date_fixed = new Date().toISOString().split('T')[0];
    const price = prompt(`${vessels[idx].vessel_name} on subs — enter fixed P6 price:`);
    if (price) {
      const val = parseRate(price, 'tc');
      if (val) vessels[idx].fixed_price = val;
    }
    const charterer = prompt(`${vessels[idx].vessel_name} — enter charterer:`);
    if (charterer) vessels[idx].charterer = charterer.trim();
  }

  save(); renderTable(); updateStats();
}

function removeVessel(idx) {
  if (!confirm(`Remove ${vessels[idx].vessel_name}?`)) return;
  vessels.splice(idx, 1);
  save(); renderTable(); updateStats();
}
